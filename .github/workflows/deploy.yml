# Despliegue automático del tema al hosting.
# Cada push a la rama main sube al servidor SOLO los archivos que han cambiado.
# Los datos de acceso viven en GitHub > Settings > Secrets and variables > Actions, nunca en el código.

name: Desplegar tema

on:
  push:
    branches: [main]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

concurrency:
  group: despliegue
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el código
        uses: actions/checkout@v4

      - name: Comprobar sintaxis PHP
        run: find . -name "*.php" -not -path "./.git/*" -print0 | xargs -0 -n1 php -l

      - name: Subir al hosting por FTPS
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          server-dir: ${{ secrets.FTP_DIR }}
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            README.md
            **/LEEME.txt
